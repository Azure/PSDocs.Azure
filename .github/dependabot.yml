#
# Dependabot configuration
#

# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Reviewers are assigned via .github/CODEOWNERS.
# Security updates are raised as soon as an advisory is published,
# independent of the version update schedule below.

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
    labels:
      - 'ci-quality'

  # Maintain dependencies for NuGet (PSDocs.Azure and PSDocs)
  - package-ecosystem: 'nuget'
    directories:
      - '/packages/psdocs-azure/src/PSDocs.Azure'
      - '/packages/psdocs/src/PSDocs'
      - '/packages/psdocs/src/PSDocs.Benchmark'
      - '/packages/psdocs/tests/PSDocs.Tests'
    schedule:
      interval: 'weekly'
    groups:
      nuget-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'

  # Maintain dependencies for the VS Code extension
  - package-ecosystem: 'npm'
    directory: '/packages/vscode-extension'
    schedule:
      interval: 'weekly'
    groups:
      npm-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'

  # Maintain dependencies for Python (documentation site)
  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      docs:
        patterns:
          - '*'
    labels:
      - 'ci-quality'
